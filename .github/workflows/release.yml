name: Release — Build, Package, Publish

# MinVer reads the nearest git tag from the full commit history to derive
# Version automatically — no manual version job needed.
# Tag format:  v<MAJOR>.<MINOR>.<PATCH>  (e.g. git tag v1.0.0)
# Untagged commits get a pre-release suffix:  1.0.0-dev.3

on:
  push:
    # branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:

  # ─────────────────────────────────────────────────────────────────────
  # dotnet publish — produces self-contained single-file binary per RID
  # MinVer is a build-time package; it resolves Version during dotnet publish.
  # fetch-depth: 0 is REQUIRED so MinVer can walk back to the nearest tag.
  # ─────────────────────────────────────────────────────────────────────
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            self_contained: false
          - rid: win-x86
            self_contained: false
          - rid: linux-x64
            self_contained: true
          - rid: linux-arm64
            self_contained: true
          - rid: linux-arm
            self_contained: true
          - rid: osx-x64
            self_contained: true
          - rid: osx-arm64
            self_contained: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # MinVer needs full history to find the nearest tag

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore GreenSwampAlpaca.slnx

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish GreenSwamp.Alpaca.Server/GreenSwamp.Alpaca.Server.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained ${{ matrix.self_contained }}
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -o publish/${{ matrix.rid }}

      - name: Ensure executable bit for Unix RIDs
        if: startsWith(matrix.rid, 'linux-') || startsWith(matrix.rid, 'osx-')
        run: chmod +x "publish/${{ matrix.rid }}/GreenSwamp.Alpaca.Server"

      - name: Include macOS app icon in publish payload
        if: startsWith(matrix.rid, 'osx-')
        run: |
          cp "GreenSwamp.Alpaca.Server/Resources/greenswamp.icns" "publish/${{ matrix.rid }}/greenswamp.icns"
          test -f "publish/${{ matrix.rid }}/greenswamp.icns"

      # minver-cli runs MinVer directly against the git repo — unlike
      # `dotnet msbuild -getProperty:Version` it actually executes the MinVer
      # target rather than reading the Version property statically (which would
      # always return the SDK default of 1.0.0 instead of the tag-derived version).
      - name: Install MinVer CLI
        run: dotnet tool install --global minver-cli

      - name: Read version from MinVer
        id: minver
        run: |
          VER=$(minver --tag-prefix v 2>/dev/null)
          VER="${VER:-0.0.0-dev}"
          MSI_VER="${VER%%[-+]*}"   # 0.1.2-beta+sha -> 0.1.2
          echo "app_version=$VER" >> $GITHUB_OUTPUT
          echo "msi_version=$MSI_VER" >> $GITHUB_OUTPUT
          echo "MinVer resolved version: $VER"
          echo "MSI-safe version: $MSI_VER"

      - uses: actions/upload-artifact@v5
        with:
          name: greenswamp-alpaca-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/**
          retention-days: 7

    outputs:
      app_version: ${{ steps.minver.outputs.app_version }}
      msi_version: ${{ steps.minver.outputs.msi_version }}

  # ─────────────────────────────────────────────────────────────────────
  # Build .deb packages for Linux x64 and Raspberry Pi (arm64 + armhf)
  # ─────────────────────────────────────────────────────────────────────
  build-deb:
    name: Build DEB (${{ matrix.rid }})
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ linux-x64, linux-arm64, linux-arm ]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          name: greenswamp-alpaca-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

      - name: Install packaging tools
        run: sudo apt-get install -y --no-install-recommends fakeroot dpkg-dev

      - name: Build DEB
        run: |
          chmod +x Installer/Linux/build-deb.sh
          ./Installer/Linux/build-deb.sh \
            ${{ matrix.rid }} \
            ${{ needs.publish.outputs.app_version }}

      - uses: actions/upload-artifact@v5
        with:
          name: deb-${{ matrix.rid }}
          path: "*.deb"
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Build .msi packages for Windows x64 and x86
  # The publish artifacts are downloaded from the publish job so the installer
  # project does not need to rebuild or re-publish the server.
  # MinVer runs automatically during dotnet build via Directory.Build.targets
  # (_SetWixVersionFromMinVer) to populate $(var.InstallerVersion) in the .wxs.
  # fetch-depth: 0 ensures MinVer resolves the same tag as the publish job.
  # ─────────────────────────────────────────────────────────────────────
  build-msi:
    name: Build MSI (${{ matrix.rid }})
    needs: publish
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # UpgradeCode is the permanent GUID for each RID's product family
          # platform must be x64/x86 — WiX does not accept win-x64/win-x86 as Platform values
          - rid: win-x64
            platform: x64
            upgrade_code: "0BFB5E9F-4475-4BFA-A8A5-1F26CD982B1C"
          - rid: win-x86
            platform: x86
            upgrade_code: "D910192D-77C9-499E-80E9-10428B7FB80F"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # MinVer needs full history

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\NuGet\Cache
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v5
        with:
          name: greenswamp-alpaca-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

      - name: Build MSI
        # SkipPublish=true             — artifacts already downloaded from the publish job;
        #                               suppresses _PublishServerBeforeWix in the wixproj.
        # BuildProjectReferences=false — Server project output is not used by WiX
        #                               (all files come from PublishDir); avoids restoring
        #                               the Server's full NuGet dependency tree on this runner.
        # AppVersion is omitted        — $(var.InstallerVersion) in the .wxs is now set
        #                               automatically by MinVer via Directory.Build.targets.
        run: >
          dotnet build GreenSwamp.Alpaca.Installer/GreenSwamp.Alpaca.Installer.wixproj
          -c Release
          -p:Platform=${{ matrix.platform }}
          -p:UpgradeCode=${{ matrix.upgrade_code }}
          "-p:PublishDir=${{ github.workspace }}/publish/${{ matrix.rid }}/"
          -p:SkipPublish=true
          -p:BuildProjectReferences=false

      - uses: actions/upload-artifact@v5
        with:
          name: msi-${{ matrix.rid }}
          path: "**/*.msi"
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Build signed/notarized .dmg packages for macOS x64 + arm64
  # Release MUST fail if notarization fails.
  # ─────────────────────────────────────────────────────────────────────
  build-dmg:
    name: Build DMG (${{ matrix.rid }})
    needs: publish
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ osx-x64, osx-arm64 ]

    env:
      APP_NAME: GreenSwamp Alpaca Server
      APP_EXECUTABLE: GreenSwamp.Alpaca.Server
      APP_BUNDLE_ID: com.greenswamp.alpaca.server
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APP_SIGNING_IDENTITY }}
      APPLE_CERT_B64: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_B64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          name: greenswamp-alpaca-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

      - name: Verify published payload exists
        run: |
          test -d "publish/${{ matrix.rid }}" || { echo "::error::Missing publish/${{ matrix.rid }}"; exit 1; }
          ls -la "publish/${{ matrix.rid }}"
 
      - name: Restore Developer ID cert to temporary keychain
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERT_B64:-}" ]; then
            echo "::error::Secret APPLE_DEVELOPER_ID_APP_CERT_B64 is empty or unavailable in this workflow context."
            exit 1
          fi

          if [ -z "${APPLE_CERT_PASSWORD:-}" ]; then
            echo "::error::Secret APPLE_DEVELOPER_ID_APP_CERT_PASSWORD is empty or unavailable in this workflow context."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # decode base64 in a macOS-compatible way
          if ! printf '%s' "$APPLE_CERT_B64" | base64 --decode > "$RUNNER_TEMP/devid.p12" 2>/dev/null; then
            printf '%s' "$APPLE_CERT_B64" | base64 -D > "$RUNNER_TEMP/devid.p12"
          fi

          if [ ! -s "$RUNNER_TEMP/devid.p12" ]; then
            echo "::error::Decoded .p12 is empty. Check APPLE_DEVELOPER_ID_APP_CERT_B64 content (no truncation/newlines issues)."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/devid.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build .app bundle
        run: |
          APP_PATH="dist/${APP_NAME}.app"
          CONTENTS="$APP_PATH/Contents"
          MACOS_DIR="$CONTENTS/MacOS"
          RES_DIR="$CONTENTS/Resources"
          PAYLOAD_DIR="$RES_DIR/app"
          LAUNCHER_NAME="GreenSwampAlpacaLauncher"
          ICON_BASE_NAME="greenswamp"

          mkdir -p "$MACOS_DIR" "$PAYLOAD_DIR" "$RES_DIR"

          # Put full publish payload in Resources (not MacOS)
          cp -R "publish/${{ matrix.rid }}/." "$PAYLOAD_DIR/"
          chmod +x "$PAYLOAD_DIR/GreenSwamp.Alpaca.Server"

          # Copy app icon into bundle resources
          cp "$PAYLOAD_DIR/greenswamp.icns" "$RES_DIR/greenswamp.icns"

          # Remove debug/docs artifacts not needed at runtime
          find "$PAYLOAD_DIR" -type f \( -name "*.pdb" -o -name "*.xml" \) -delete

          # Launcher in MacOS
          cat > "$MACOS_DIR/$LAUNCHER_NAME" <<'SH'
          #!/bin/bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          APP_ROOT="$(cd "$SCRIPT_DIR/.." && pwd)"
          PAYLOAD_DIR="$APP_ROOT/Resources/app"
          cd "$PAYLOAD_DIR"
          exec "./GreenSwamp.Alpaca.Server" "$@"
          SH
          chmod +x "$MACOS_DIR/$LAUNCHER_NAME"

          cat > "$CONTENTS/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>CFBundleName</key><string>${APP_NAME}</string>
              <key>CFBundleDisplayName</key><string>${APP_NAME}</string>
              <key>CFBundleIdentifier</key><string>${APP_BUNDLE_ID}</string>
              <key>CFBundleVersion</key><string>${{ needs.publish.outputs.msi_version }}</string>
              <key>CFBundleShortVersionString</key><string>${{ needs.publish.outputs.msi_version }}</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleExecutable</key><string>${LAUNCHER_NAME}</string>
              <key>CFBundleIconFile</key><string>${ICON_BASE_NAME}</string>
              <key>LSMinimumSystemVersion</key><string>12.0</string>
            </dict>
          </plist>
          PLIST

      - name: Create entitlements
        run: |
          cat > "$RUNNER_TEMP/entitlements.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
            </dict>
          </plist>
          PLIST

      - name: Sign .app bundle (hardened runtime)
        run: |
          APP_PATH="dist/${APP_NAME}.app"

          # Sign nested Mach-O binaries first
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --timestamp --options runtime \
                --entitlements "$RUNNER_TEMP/entitlements.plist" \
                --sign "$APPLE_SIGN_IDENTITY" \
                "$f"
            fi
          done < <(find "$APP_PATH" -type f -print0)

          # Sign app wrapper last
          codesign --force --timestamp --options runtime \
            --entitlements "$RUNNER_TEMP/entitlements.plist" \
            --sign "$APPLE_SIGN_IDENTITY" \
            "$APP_PATH"

          codesign --verify --strict --verbose=2 "$APP_PATH"

      - name: Create DMG (create-dmg with hdiutil fallback)
        run: |
          set -euo pipefail

          APP_PATH="dist/${APP_NAME}.app"
          DMG_NAME="GreenSwamp-Alpaca-${{ needs.publish.outputs.app_version }}-${{ matrix.rid }}.dmg"
          STAGE_DIR="$RUNNER_TEMP/dmg-root"

          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          cp -R "$APP_PATH" "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"

          if brew list create-dmg >/dev/null 2>&1 || brew install create-dmg; then
            echo "Using create-dmg"
            create-dmg \
              --volname "$APP_NAME" \
              --window-pos 200 120 \
              --window-size 800 400 \
              --icon-size 100 \
              --icon "${APP_NAME}.app" 200 190 \
              --app-drop-link 600 185 \
              "$DMG_NAME" \
              "$STAGE_DIR"
          else
            echo "create-dmg unavailable; falling back to hdiutil"
            hdiutil create -volname "$APP_NAME" -srcfolder "$STAGE_DIR" -ov -format UDZO "$DMG_NAME"
          fi

          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"
      - name: Sign DMG
        run: |
          codesign --force --timestamp --sign "$APPLE_SIGN_IDENTITY" "$DMG_NAME"

      - name: Notarize DMG (fail workflow on any notarization error)
        run: |
          if ! printf '%s' "${{ secrets.APPLE_NOTARY_API_KEY_B64 }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8" 2>/dev/null; then
            printf '%s' "${{ secrets.APPLE_NOTARY_API_KEY_B64 }}" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          fi
          xcrun notarytool submit "$DMG_NAME" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "${{ secrets.APPLE_NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_NOTARY_ISSUER_ID }}" \
            --wait
          xcrun stapler staple "$DMG_NAME"

      - uses: actions/upload-artifact@v5
        with:
          name: dmg-${{ matrix.rid }}
          path: "*.dmg"
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Create GitHub Release and attach all installer artefacts
  # Only runs on tag pushes (not on branch pushes or PRs)
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [ build-deb, build-msi, build-dmg ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets (diagnostic)
        run: find release-assets -type f | sort

      - name: Create/Update GitHub Release (resilient)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ github.ref_name }}" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          mapfile -t ASSETS < <(
            find release-assets -type f \( -name "*.msi" -o -name "*.deb" -o -name "*.dmg" \) \
            | grep -v '/obj/' \
            | sort -u
          )

          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "GreenSwamp Alpaca Server ${{ github.ref_name }}" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi

          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            "${ASSETS[@]}"